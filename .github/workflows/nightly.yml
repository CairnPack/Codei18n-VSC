name: Nightly Build

# 每日构建 VSIX，并发布为滚动预发布 `nightly`（不会成为 latest）。
#
# 是否构建的判定方式：比较默认分支 HEAD 与现有 `nightly` tag 指向的提交。
#   - 两者相同：自上次成功的 nightly 以来没有新代码，跳过整个构建。
#   - 两者不同，或 `nightly` tag 尚不存在：构建并发布，成功后才把 `nightly` tag 移到 HEAD。
# 因为 tag 只在发布成功后移动，某次构建失败时 tag 停留在旧提交，第二天会自动重试。
#
# nightly 的版本号为下一个补丁版本加预发布后缀，例如 package.json 为 0.1.0 时是 0.1.1-nightly.20261019.42，
# 从 VSIX 安装时高于已发布的正式版。
# pull_request 只构建、不发布，用来在 PR 上验证 workflow 本身能跑通。
# workflow_dispatch 可勾选 allow_non_default，从非默认分支手动发布（仅用于合并前验证发布流程）。
# 只使用 GITHUB_TOKEN（contents: write），不需要任何 PAT 或密钥。

on:
  schedule:
    # UTC 16:00，即台北时间 0 点。schedule 只在默认分支生效。
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      allow_non_default:
        description: 允许从非默认分支发布 nightly（仅用于验证发布流程）
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nightly.yml'
      - '.github/workflows/build-vsix.yml'

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: 判定是否需要构建
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
      publish: ${{ steps.decide.outputs.publish }}
      head: ${{ steps.decide.outputs.head }}
      previous: ${{ steps.decide.outputs.previous }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 比较 HEAD 与 nightly tag
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ALLOW_NON_DEFAULT: ${{ inputs.allow_non_default }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          previous=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)
          base=$(node -p "require('./package.json').version.split('-')[0]")
          IFS=. read -r major minor patch <<< "$base"
          version="$major.$minor.$((patch + 1))-nightly.$(TZ=Asia/Taipei date +%Y%m%d).$RUN_NUMBER"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == pull_request ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "PR 验证：只构建 $version、不发布。" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$REF_NAME" != "$DEFAULT_BRANCH" && "$ALLOW_NON_DEFAULT" != true ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "只从默认分支 $DEFAULT_BRANCH 发布 nightly，当前为 $REF_NAME，跳过。" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$head" == "$previous" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "HEAD ${head:0:7} 与 nightly tag 相同，没有新代码，跳过构建。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "HEAD ${head:0:7} 与 nightly tag（${previous:0:7}）不同，构建并发布 $version。" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build-vsix.yml
    with:
      version: ${{ needs.check.outputs.version }}

  publish:
    name: 发布 nightly 预发布
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: codei18n-vscode-${{ needs.check.outputs.version }}
          path: dist

      - name: 移动 nightly tag 并替换预发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.check.outputs.head }}
          PREVIOUS: ${{ needs.check.outputs.previous }}
          VERSION: ${{ needs.check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ls -l dist
          short=${HEAD_SHA:0:7}
          title="Nightly $(TZ=Asia/Taipei date +%Y-%m-%d) (${short})"
          {
            echo "自动构建的每日预发布 \`$VERSION\`，对应提交 ${HEAD_SHA}。不是正式版，可能不稳定。"
            echo
            echo "安装：VS Code 命令面板 → Extensions: Install from VSIX…，选择附件中的 \`.vsix\`（需要 VS Code 1.105 或更高版本）。"
            echo
            if [[ -n "$PREVIOUS" ]] && git merge-base --is-ancestor "$PREVIOUS" "$HEAD_SHA"; then
              echo "## 自上次 nightly（${PREVIOUS:0:7}）以来的提交"
              echo
              echo '```'
              git log --oneline "${PREVIOUS}..${HEAD_SHA}"
              echo '```'
            else
              echo "## 最近的提交（没有可比较的上次 nightly）"
              echo
              echo '```'
              git log --oneline -20 "$HEAD_SHA"
              echo '```'
            fi
          } > notes.md

          # 顺序保证任何一步失败都可安全重试：先上传新附件，再删旧附件，最后才移动 tag。
          # tag 没移动时，下一次定时运行仍会发现 HEAD 与 tag 不同而重新构建。
          if gh release view nightly > /dev/null 2>&1; then
            gh release upload nightly dist/* --clobber
            keep=$(cd dist && ls)
            gh release view nightly --json assets --jq '.assets[].name' | while IFS= read -r name; do
              if ! grep -qxF "$name" <<< "$keep"; then gh release delete-asset nightly "$name" --yes; fi
            done
            git tag -f nightly "$HEAD_SHA"
            git push -f origin refs/tags/nightly
            gh release edit nightly --title "$title" --notes-file notes.md --prerelease --latest=false
          else
            # 首次发布：先建草稿并上传附件（草稿不创建 tag），全部成功后公开，此时才在 HEAD 上创建 tag。
            gh release create nightly dist/* --target "$HEAD_SHA" --title "$title" --notes-file notes.md --prerelease --draft
            gh release edit nightly --draft=false --latest=false
          fi
